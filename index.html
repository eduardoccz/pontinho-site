<style>
/* Layout: uma coluna de até 760px; cabeçalho no topo, conteúdo que rola no meio e abas embaixo.
   O placar é uma lista em ordem de quem está ganhando; as rodadas são um bloco de marcação, como o de papel. */
:root {
  --bg: #F3F6F4; --surface: #FFFFFF; --ink: #1B1B1F; --muted: #5B6168; --line: #D3DAD6;
  --green: #0F6B4F; --on-green: #FFFFFF; --green-tint: #E3F1EA;
  --red: #C8102E; --on-red: #FFFFFF; --red-tint: #FCECEE;
  --card: #FFFFFF; --card-ink: #1B1B1F; --card-red: #C8102E; --card-line: #1B1B1F; --card-green: #0F6B4F;
  --grid: #E3E7E4; --axis: #8A938E;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948; --sx: #898781;
  --display: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --body: 'Atkinson Hyperlegible', Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #17201D; --ink: #EFF3F1; --muted: #A4AEA9; --line: #2C3834;
    --green: #45C296; --on-green: #07261B; --green-tint: #17342B;
    --red: #FF7A8A; --on-red: #33070E; --red-tint: #3B1B21;
    --card: #F2F4F3; --card-ink: #1B1B1F; --card-red: #C8102E; --card-line: #0E1412; --card-green: #0F6B4F;
    --grid: #26312D; --axis: #7F8A85;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --sx: #898781;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #17201D; --ink: #EFF3F1; --muted: #A4AEA9; --line: #2C3834;
  --green: #45C296; --on-green: #07261B; --green-tint: #17342B;
  --red: #FF7A8A; --on-red: #33070E; --red-tint: #3B1B21;
  --card: #F2F4F3; --card-ink: #1B1B1F; --card-red: #C8102E; --card-line: #0E1412; --card-green: #0F6B4F;
  --grid: #26312D; --axis: #7F8A85;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --sx: #898781;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.2; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.25; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.app { height: 100%; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 760px; margin-inline: auto; padding-inline: 16px; }

.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em; }
.suits { display: flex; gap: 3px; }
.suits svg { width: 14px; height: 14px; }
.suit-b { fill: var(--ink); } .suit-r { fill: var(--red); }
.top-sub { flex: 1; min-width: 0; text-align: right; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.top-link { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding-inline: 6px; font-weight: 700; color: var(--green); text-underline-offset: 3px; }

main { flex: 1; min-height: 0; overflow-y: auto; }
main:focus { outline: none; }
.view { display: flex; flex-direction: column; gap: 20px; padding-block: 20px 28px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.home { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 4px; }
.home .logo { width: 220px; max-width: 62%; height: auto; }
.home p { max-width: 34ch; }
.home-acoes { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.inline input { min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); }
@media (max-height: 620px) { .home .logo { width: 150px; } .view { gap: 14px; padding-block: 14px 20px; } }
@media (max-width: 380px) { .home .logo { width: 140px; } }
@media (max-width: 340px) { .home .logo { width: 116px; } }

.tabs { background: var(--surface); border-top: 1px solid var(--line); }
.tabs .wrap { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; padding-block: 6px; padding-inline: 8px; }
.tab { min-width: 0; min-height: 52px; padding: 0 1px; border: 0; background: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 1.2; color: var(--muted); text-decoration: none; white-space: nowrap; }
.tab .longo { display: none; }
@media (max-width: 359px) { .tab { font-size: 11px; } }
@media (min-width: 560px) { .tab { font-size: 13px; } .tab .longo { display: inline; } .tab .curto { display: none; } .tabs .wrap { gap: 4px; padding-inline: 16px; } }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--green); font-weight: 700; background: var(--green-tint); }
@media (max-height: 480px) { /* celular deitado */ .top .wrap { padding-block: 6px; } .brand-name { font-size: 22px; } .tabs .wrap { padding-block: 4px; }
  .tab { flex-direction: row; gap: 6px; min-height: 40px; } .tab svg { width: 18px; height: 18px; } .tab .longo { display: none; } .tab .curto { display: inline; } .home .logo { width: 110px; } }

.btn { min-height: 48px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.quiet { border-color: var(--line); font-weight: 400; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { border: 0; background: none; padding: 8px 4px; min-height: 44px; color: var(--green); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.link.danger-text { color: var(--red); }

.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--green-tint); color: var(--ink); white-space: nowrap; }
.tag.ex { background: var(--red-tint); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--green-tint); }
.note.warn { background: var(--red-tint); }

/* Placar */
.rank { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rank li { display: grid; grid-template-columns: 38px 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.rank li:first-child { border-top: 0; }
.rank li.lead { background: var(--green-tint); }
.pos { font-family: var(--display); font-weight: 800; font-size: 20px; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.who { min-width: 0; display: flex; flex-direction: column; }
.nome { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); }
.pts { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
.pts small { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 4px; }

/* Bloco de rodadas */
.scroll-x { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; font-size: 14px; vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; }
tfoot td, tfoot th { font-weight: 700; border-top: 2px solid var(--ink); }
.th-nome { display: inline-flex; align-items: center; gap: 6px; max-width: 110px; white-space: normal; overflow-wrap: anywhere; text-align: right; }
.bateu { font-weight: 700; color: var(--green); }
.edit-rod { min-width: 44px; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }

/* Estatísticas */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .lab { font-size: 14px; color: var(--muted); }
.tile .val { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.tile .sub { font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
#chart { touch-action: pan-y; min-width: 0; }
#chart svg { display: block; max-width: 100%; }
.grid-l { stroke: var(--grid); stroke-width: 1; }
.cross { stroke: var(--axis); stroke-width: 1; }
.ax { fill: var(--muted); font-size: 12px; font-family: var(--body); }
.lbl { fill: var(--ink); font-size: 13px; font-family: var(--body); }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.mk { stroke: var(--surface); stroke-width: 2; }
.slider { display: flex; align-items: center; gap: 10px; }
.slider input { flex: 1; min-width: 0; accent-color: var(--green); height: 32px; }
.readout { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 4px 16px; }
.readout li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.readout .rn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.readout .rv { font-variant-numeric: tabular-nums; font-weight: 700; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(64px, max-content) minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.bars li { display: contents; }
.bars .bn { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 150px; font-weight: 700; overflow-wrap: anywhere; }
.bars .bt { display: flex; align-items: center; gap: 8px; min-width: 0; border-left: 1px solid var(--axis); padding-block: 3px; }
.bars .bf { height: 16px; border-radius: 0 4px 4px 0; background: var(--green); }
.bars .bv { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.facts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* Partidas */
.games { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.game.cur { border: 2px solid var(--green); }
.game-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.game-nome { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }

/* Folhas de lançamento */
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .wrap { display: flex; flex-direction: column; gap: 18px; padding-block: 18px 28px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 700; overflow-wrap: anywhere; }
.chip.sm { min-height: 44px; padding: 6px 14px; font-weight: 400; border-color: var(--line); }
.periodo .field { flex: 1; min-width: 140px; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.hand { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.hand-head { width: 100%; min-height: 56px; border: 0; background: none; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
.hand-head .nome { font-size: 17px; }
.hand-pts { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hand-pts.falta { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); }
.hand-body { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; align-items: center; }
.pk { min-height: 40px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--card-line); background: var(--card); color: var(--card-ink); font-family: var(--display); font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.pk .x { font-family: var(--body); font-weight: 400; font-size: 13px; }
.pad { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.cardbtn { min-height: 64px; border-radius: 8px; border: 1.5px solid var(--card-line); background: var(--card); color: var(--card-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.cardbtn .r { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; }
.cardbtn .v { font-size: 12px; line-height: 1; }
.cardbtn.red .r { color: var(--card-red); }
.cardbtn svg, .pk svg { width: 20px; height: 20px; fill: var(--card-green); }
.cardbtn:active { transform: translateY(1px); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; font-weight: 700; }
.field textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 14px/1.45 var(--body); resize: vertical; }
.exp-img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.outros summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; color: var(--green); }
.field input { min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); width: 100%; }
.inline { display: flex; align-items: center; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.icon-btn { flex: none; width: 48px; height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.sheet-foot { display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .cardbtn { transition: transform 0.08s; } }
</style>

<script>
(function () {
'use strict';

/* ---------- regras da casa ---------- */
var CARTAS = [
  { k: 'JK', r: 'Coringa', v: 20 }, { k: 'A', r: 'A', v: 15 }, { k: 'K', r: 'K', v: 13 },

function gerarImagem(g) {

  if (f) f.focus({ preventScroll: true });
}
function avisarExp(m) { var e = $('#exp-msg'); if (e) e.textContent = m; if (S.draft && S.draft.tipo === 'exportar') S.draft.msg = m; }
function fecharFolha() { S.draft = null; S.confirm = null; limparExp(); renderSheet(); }

/* ---------- ações ---------- */
function acao(a, t) {
  var g = cur(), d = S.draft, id = t.getAttribute('data-id');
  switch (a) {
    case 'tab': S.tab = t.getAttribute('data-tab'); S.confirm = null; marcarEndereco(); renderView(); $('#view').scrollTop = 0; break;
    case 'continuar': escolher(id); S.tab = 'placar'; marcarEndereco(); renderView(); $('#view').scrollTop = 0; break;
    case 'nova': {
      var ult = ordenadas().find(function (x) { return !x.exemplo; });
      var nomes = ult ? ult.jogadores.map(function (j) { return j.nome; }) : ['', '', '', ''];
      S.draft = { tipo: 'nova', nome: 'Partida de ' + dataCurta(new Date().toISOString()), nomes: nomes, erro: '' }; renderSheet('np-j0'); break;
    }
    case 'np-mais': d.nomes.push(''); renderSheet('np-j' + (d.nomes.length - 1)); break;
    case 'np-tirar': d.nomes.splice(Number(t.getAttribute('data-i')), 1); renderSheet(); break;
    case 'np-criar': {
      var limpos = d.nomes.map(function (n) { return n.trim(); }).filter(Boolean);
      if (limpos.length < 2) { d.erro = 'Coloque o nome de pelo menos dois jogadores.'; renderSheet(); break; }
      var novo = { id: uid('p'), nome: d.nome.trim() || 'Partida de ' + dataCurta(new Date().toISOString()), criadaEm: new Date().toISOString(), encerradaEm: null,
        jogadores: limpos.map(function (n, i) { return { id: 'j' + (i + 1), nome: n, desde: 0, base: 0 }; }), rodadas: [] };
      if (S.mode === 'local') S.games = S.games.filter(function (x) { return !x.exemplo; });
      escolher(novo.id); S.tab = 'placar'; marcarEndereco(); S.draft = null; renderSheet(); commit(novo); break;
    }
    case 'jogador': S.draft = { tipo: 'jogador', nome: '', base: '0', erro: '' }; renderSheet('nj-nome'); break;
    case 'nj-criar': {
      var nm = d.nome.trim(); if (!nm) { d.erro = 'Escreva o nome de quem chegou.'; renderSheet('nj-nome'); break; }
      var g2 = clone(g), n = 1; while (g2.jogadores.some(function (j) { return j.id === 'j' + n; })) n++;
      g2.jogadores.push({ id: 'j' + n, nome: nm, desde: g2.rodadas.length, base: Math.max(0, Math.floor(Number(d.base) || 0)) });
      S.draft = null; renderSheet(); commit(g2); break;
    }
    case 'exemplo': { var ex = clone(EXEMPLO); ex.criadaEm = new Date().toISOString(); escolher(ex.id); S.tab = 'placar'; marcarEndereco(); commit(ex); break; }
    case 'fechar-exemplo': S.games = S.games.filter(function (x) { return !x.exemplo; }); S.gameId = null; S.chartRound = null; S.tab = 'inicial'; marcarEndereco(); renderView(); break;
    case 'rodada': abrirRodada(null); break;
    case 'editar': abrirRodada(Number(t.getAttribute('data-idx'))); break;
    case 'bateu': {
      d.bateu = id;
      var prim = ativosEm(g, d.idx).find(function (j) { return j.id !== id && !pontosDaMao(d.maos[j.id]); });
      d.aberto = prim ? prim.id : null; renderSheet('bt-' + id); break;
    }
    case 'abrir-mao': d.aberto = d.aberto === id ? null : id; renderSheet('hd-' + id); break;
    case 'prox-mao': {
      var outros = ativosEm(g, d.idx).filter(function (j) { return j.id !== d.bateu; });
      var i = outros.findIndex(function (j) { return j.id === id; });
      var prox = outros.slice(i + 1).concat(outros.slice(0, i)).find(function (j) { return !pontosDaMao(d.maos[j.id]); });
      d.aberto = prox ? prox.id : null; renderSheet(prox ? 'hd-' + prox.id : 'salvar-rodada'); break;
    }
    case 'carta': {
      var m = d.maos[id], k = t.getAttribute('data-k'); m.manual = ''; m.cartas[k] = (m.cartas[k] || 0) + 1; renderSheet('cb-' + id + '-' + k); break;
    }
    case 'tirar': {
      var m2 = d.maos[id], k2 = t.getAttribute('data-k'); if (m2.cartas[k2] > 1) m2.cartas[k2]--; else delete m2.cartas[k2]; renderSheet('hd-' + id); break;
    }
    case 'salvar-rodada': {
      if (!rodadaValida(g, d)) break;
      var rd = { id: d.id || uid('r'), bateu: d.bateu, maos: {}, em: d.em || new Date().toISOString() };
      ativosEm(g, d.idx).forEach(function (j) {
        if (j.id === d.bateu) return;
        var mm = d.maos[j.id], man = mm.manual !== '';
        rd.maos[j.id] = { pontos: pontosDaMao(mm), cartas: man ? {} : mm.cartas, manual: man };
      });
      var g3 = clone(g); if (d.editando) g3.rodadas[d.idx] = rd; else g3.rodadas.push(rd);
      S.chartRound = null; S.draft = null; renderSheet(); commit(g3); break;
    }
    case 'apagar-rodada': S.confirm = 'apagar-rodada'; renderSheet(); break;
    case 'cancelar-conf-folha': S.confirm = null; renderSheet(); break;
    case 'apagar-rodada-sim': {
      var g4 = clone(g); g4.rodadas.splice(d.idx, 1);
      g4.jogadores.forEach(function (j) { if ((j.desde || 0) > d.idx) j.desde--; });
      S.chartRound = null; S.draft = null; S.confirm = null; renderSheet(); commit(g4); break;
    }
    case 'exportar': {
      var ge = id ? S.games.find(function (x) { return x.id === id; }) : g; if (!ge) break;
      limparExp(); S.draft = { tipo: 'exportar', gid: ge.id, msg: '' }; renderSheet();
      gerarImagem(ge).then(function (blob) {
        if (!S.draft || S.draft.tipo !== 'exportar' || S.draft.gid !== ge.id) return;
        limparExp(); expAtual = { gid: ge.id, blob: blob, url: URL.createObjectURL(blob) };
        var im = $('#exp-img'); if (im) { im.src = expAtual.url; im.hidden = false; }
        ['#exp-baixar', '#exp-comp'].forEach(function (q) { var bt = $(q); if (bt) bt.disabled = false; });
        avisarExp('');
      }, function () { avisarExp('Não deu para gerar a imagem neste aparelho. Use os outros formatos abaixo.'); });
      break;
    }
    case 'exp-img': {
      var gi = S.games.find(function (x) { return x.id === d.gid; }); if (!gi || !expAtual) break;
      baixar(nomeArquivo(gi) + '.png', expAtual.blob, 'image/png').then(function (r) {
        avisarExp(r === 'link' ? 'Imagem enviada para os downloads do aparelho.' : 'Imagem salva.');
      }, function (e) {
        var c = e && e.code;
        avisarExp(c === 'declined' ? 'Download cancelado.' : c === 'rate_limited' ? 'Já existe um pedido de download aberto. Responda a ele e tente de novo.' : 'Não deu para baixar aqui. Tente tocar e segurar a imagem para salvar.');
      });
      break;
    }
    case 'exp-compartilhar': {
      var gs = S.games.find(function (x) { return x.id === d.gid; }); if (!gs || !expAtual) break;
      var arq = new File([expAtual.blob], nomeArquivo(gs) + '.png', { type: 'image/png' });
      if (navigator.canShare({ files: [arq] })) navigator.share({ files: [arq], title: gs.nome }).catch(function () { /* a pessoa fechou o compartilhamento */ });
      else avisarExp('Este aparelho não compartilha arquivos por aqui. Use Baixar imagem.');
      break;
    }
    case 'exp-copiar': {
      var ta = $('#exp-texto'), dt = ta.closest('details'); if (dt) dt.open = true;
      var naMao = function () { ta.focus(); ta.select(); avisarExp('Não deu para copiar sozinho. O texto está selecionado: use o Copiar do aparelho.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { avisarExp('Resumo copiado. Cole onde quiser enviar.'); }, naMao); else naMao();
      break;
    }
    case 'exp-csv': {
      var gc = S.games.find(function (x) { return x.id === d.gid; }); if (!gc) break;
      baixar(nomeArquivo(gc) + '.csv', planilhaCSV(gc), 'text/csv;charset=utf-8').then(function (r) {
        avisarExp(r === 'link' ? 'Planilha enviada para os downloads do aparelho.' : 'Planilha salva.');
      }, function (e) {
        var c = e && e.code;
        avisarExp(c === 'declined' ? 'Download cancelado.' : c === 'rate_limited' ? 'Já existe um pedido de download aberto. Responda a ele e tente de novo.' : 'Não deu para baixar a planilha aqui. Use o resumo em texto abaixo.');
      });
      break;
    }
    case 'fechar': fecharFolha(); break;
    case 'encerrar': { var g5 = clone(g); g5.encerradaEm = new Date().toISOString(); commit(g5); break; }
    case 'reabrir': { var g6 = clone(g); g6.encerradaEm = null; commit(g6); break; }
    case 'abrir': escolher(id); S.tab = 'placar'; marcarEndereco(); renderView(); $('#view').scrollTop = 0; break;
    case 'filtro': { S.filtro.tipo = t.getAttribute('data-f'); S.confirm = null; renderView(); var fb = document.getElementById('f-' + S.filtro.tipo); if (fb) fb.focus(); break; }
    case 'renomear': {
      var gr = S.games.find(function (x) { return x.id === id; }); S.confirm = 'renomear:' + id; S.renome = gr ? gr.nome : ''; renderView();
      var campo = document.getElementById('rn-campo'); if (campo) { campo.focus(); campo.select(); } break;
    }
    case 'renomear-sim': {
      var gx = S.games.find(function (x) { return x.id === id; }), nn = (S.renome || '').trim().slice(0, 40); S.confirm = null;
      if (gx && nn && nn !== gx.nome) { var g7 = clone(gx); g7.nome = nn; commit(g7); } else renderView();
      break;
    }
    case 'apagar': S.confirm = 'apagar:' + id; renderView(); break;
    case 'cancelar-conf': S.confirm = null; renderView(); break;
    case 'apagar-sim': S.confirm = null; apagarPartida(id); break;
  }
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]'); if (!t || t.disabled) return;
  acao(t.getAttribute('data-act'), t);
});
function aoDigitar(ev) {
  var t = ev.target, tipo = t.getAttribute && t.getAttribute('data-in'), d = S.draft;
  if (t.id === 'rodada-sel') { S.chartRound = Number(t.value) - 1; desenhar(); return; }
  if (tipo === 'f-de' || tipo === 'f-ate') { S.filtro[tipo === 'f-de' ? 'de' : 'ate'] = t.value; var lp = $('#lista-partidas'); if (lp) lp.innerHTML = listaPartidas(); return; }
  if (tipo === 'renomear') { S.renome = t.value; return; }
  if (!tipo || !d) return;
  if (tipo === 'np-nome') d.nome = t.value;
  else if (tipo === 'np-jog') d.nomes[Number(t.getAttribute('data-i'))] = t.value;
  else if (tipo === 'nj-nome') d.nome = t.value;
  else if (tipo === 'nj-base') d.base = t.value;
  else if (tipo === 'manual') {
    var id = t.getAttribute('data-id'), m = d.maos[id]; m.manual = t.value; if (t.value !== '') { m.cartas = {}; var pk = document.getElementById('pk-' + id); if (pk) pk.innerHTML = '<span class="muted small">Total digitado.</span>'; }
    var pts = pontosDaMao(m), lab = document.getElementById('pts-' + id);
    if (lab) { lab.textContent = pts ? pts + ' pts' : 'falta lançar'; lab.className = 'hand-pts' + (pts ? '' : ' falta'); }
    var sv = $('#salvar-rodada'); if (sv) sv.disabled = !rodadaValida(cur(), d);
  }
}
document.addEventListener('input', aoDigitar);
document.addEventListener('change', aoDigitar);
document.addEventListener('pointerdown', function (ev) { if (ev.target.closest && ev.target.closest('#chart')) rodadaNoPonto(ev); });
document.addEventListener('pointermove', function (ev) {
  if (!ev.target.closest || !ev.target.closest('#chart')) return;
  if (ev.pointerType === 'mouse' || ev.buttons) rodadaNoPonto(ev);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && S.draft) fecharFolha();
  if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-in') === 'renomear') { var bs = $('[data-act="renomear-sim"]'); if (bs) acao('renomear-sim', bs); }
});
if (window.ResizeObserver) { new ResizeObserver(function () { if (S.tab === 'stats' && S.loaded) desenhar(); }).observe($('#view')); }

/* ---------- partida ---------- */
function comecar(dados) {
  if (dados && dados.tab) S.tab = dados.tab;
  S.tab = abaDoEndereco() || S.tab;
  window.addEventListener('hashchange', function () { var a = abaDoEndereco(); if (a && a !== S.tab) { S.tab = a; S.confirm = null; renderView(); $('#view').scrollTop = 0; } });
  renderView(); iniciar();
}
var hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(function () { return { tab: S.tab }; }); } catch (e) { /* segue sem */ } }
if (hot && typeof hot.ready === 'function') hot.ready(comecar); else comecar((hot && hot.data) || {});
})();
</script>
